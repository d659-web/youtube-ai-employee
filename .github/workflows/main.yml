
name: YouTube AI Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  generate-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install FFmpeg
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 4. Install Gemini SDK
      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade google-genai

      # 5. Generate YouTube Shorts Story
      - name: Generate Daily Story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p output

          python - <<'PY'
          import os
          import sys
          from google import genai

          print("Starting YouTube AI Agent...")

          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise ValueError("GEMINI_API_KEY secret is missing!")

          # Connect to Gemini with 120-second timeout
          client = genai.Client(
              api_key=api_key,
              http_options={"timeout": 300000}
          )

          prompt = """
Create one original English YouTube Shorts story.

Duration: 45-60 seconds.
Narration: 100-120 words.

Choose an interesting topic.
Start with a powerful hook.
Keep viewers curious.
End with a surprising twist.

Visual style: Choose one:
1. Stick Story: expressive black stick characters,
flat rooms, gold highlights.
2. Tall Tale 3D: cartoon people in colorful
3D-looking worlds.

Return:
TITLE:
TOPIC:
STYLE:
NARRATION:
SCENES:
Give 8-10 scenes with visual directions.
CAPTIONS:
SOUND EFFECTS:

Make it original and production-ready.
"""

          print("Sending request to Gemini AI...")

          try:
              result = client.interactions.create(
                  model="gemini-3.8-flash",
                  input=prompt,
                  store=False
              )

              script = result.output_text

              if not script:
                  raise Exception("Gemini returned an empty script!")

              os.makedirs("output", exist_ok=True)

              with open(
                  "output/script.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(script)

              print("SUCCESS: Daily story generated!")
              print(script)

          except Exception as e:
              print(f"ERROR: Gemini generation failed: {e}")
              sys.exit(1)

          finally:
              client.close()
          PY

      # 6. Save Generated Script
      - name: Save Generated Script
        uses: actions/upload-artifact@v4
        with:
          name: daily-youtube-script
          path: output/script.txt
          if-no-files-found: error
          retention-days: 7

